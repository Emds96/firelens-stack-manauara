name: FIN-01 - Build 7-slide evidence demo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-final-demo.yml'
      - 'scripts/capture_demo_map.cjs'
      - 'scripts/build_final_demo.py'
permissions:
  contents: write
concurrency:
  group: fin01-demo
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF authoring and browser dependencies
        run: |
          python -m pip install --quiet reportlab pillow pypdf
          npm install --no-save --ignore-scripts puppeteer-core@24.26.1
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Capture actual local FireLens map, archived case and historical calendar
        run: |
          python -m http.server 8124 --bind 127.0.0.1 > /tmp/firelens-demo-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node scripts/capture_demo_map.cjs
      - name: Rebuild PDF with audited real data and seven pages
        run: python scripts/build_final_demo.py
      - name: Verify count, content and visible assets
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          from PIL import Image
          p=Path('demo/FireLens_7_Slide_Demo_2026.pdf')
          doc=PdfReader(str(p))
          assert len(doc.pages)==7, len(doc.pages)
          full=' '.join(page.extract_text() or '' for page in doc.pages)
          for text in ['107 minutes', '18.62 MW', '13.09 MW', '12 Aqua', '222 NOAA-20',
                       'NOT a confirmed', '2022-2024', 'NASA FIRMS', 'ChatGPT']:
              assert text in full, text
          for file in ['/tmp/firelens_recent.png','/tmp/firelens_eagle.png','/tmp/firelens_history.png']:
              image=Image.open(file)
              assert image.width>=500 and image.height>=230, (file,image.size)
              print('DEMO_ASSET',file,'size',image.size,flush=True)
          assert p.stat().st_size>40000, p.stat().st_size
          print('FIN-01 DEMO VERIFIED:',len(doc.pages),'pages',p.stat().st_size,'bytes')
          PY
      - name: Commit only final seven-slide PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/FireLens_7_Slide_Demo_2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m "demo(FIN-01): replace 7-slide PDF with real map, Eagle case and scientific caveats"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fin01-browser-demo-screenshots
          path: |
            /tmp/firelens_recent.png
            /tmp/firelens_eagle.png
            /tmp/firelens_history.png
          retention-days: 15
