name: Construir calendário histórico validado
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/construir-historico.yml"
permissions:
  contents: write
concurrency:
  group: calendario-historico
  cancel-in-progress: false
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar testes sem dados externos
        run: python -m unittest discover -s tests -v
      - name: Ler CSVs anuais NASA FIRMS e reproduzir WAPE
        run: python -m scripts.build_historical --cache firms_cache
      - name: Publicar série somente se validação passar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.json
          if ! git diff --staged --quiet; then
            git commit -m "dados: calendário mensal histórico validado FIRMS 2022-2024"
            git push
          fi
